<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hopeboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,0..100&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EDEFE8; --ink:#1C2622; --ink-2:#4F5B55; --ink-3:#8A948F;
  --loss:#B3261E; --tile:#F6F7F3; --wash:#F0F2EC; --rule:#D5D9D1;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --loss:#E5857A; --paper:#171B18; --ink:#E4E7DF; --ink-2:#B4BBB3; --ink-3:#7E8984;
    --tile:#1F2420; --wash:#1A1F1B; --rule:#2E3531; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --loss:#E5857A; --paper:#171B18; --ink:#E4E7DF; --ink-2:#B4BBB3; --ink-3:#7E8984;
  --tile:#1F2420; --wash:#1A1F1B; --rule:#2E3531; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased}
main{max-width:1040px; margin:0 auto; padding:40px 20px 80px}
h1{font-family:"Fraunces","Iowan Old Style",Georgia,serif; font-weight:500; font-size:30px; margin:0 0 12px; letter-spacing:-0.01em}
h2{font-family:"Fraunces","Iowan Old Style",Georgia,serif; font-weight:500; font-size:22px; margin:40px 0 14px; letter-spacing:-0.01em}
#board h2:first-child{margin-top:8px}
.sub{color:var(--ink-2); margin:0 0 16px; font-size:15px; max-width:60ch}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px}
.grid{grid-auto-rows:auto}
.tile{display:grid; grid-row:span 2; grid-template-rows:subgrid; gap:10px; background:none; border:0; padding:0}
.top{background:var(--tile); border:1px solid var(--rule); border-radius:10px; padding:18px 18px 16px; display:flex; flex-direction:column; gap:12px}
.why{background:var(--wash,var(--tile)); border:1px solid var(--rule); border-radius:10px; padding:14px 18px 14px; position:relative}
.why::before{content:""; position:absolute; top:-7px; left:28px; width:12px; height:12px; background:inherit; border-left:1px solid var(--rule); border-top:1px solid var(--rule); transform:rotate(45deg)}
@supports not (grid-template-rows:subgrid){ .tile{display:flex; flex-direction:column} }
.head{display:flex; align-items:center; gap:12px}
.head .name{flex:1}
.price{text-align:right; line-height:1.1; font-variant-numeric:tabular-nums}
.price .n{display:block; font-size:17px; color:var(--ink); white-space:nowrap; margin:2px 0}
.price .u{display:block; font-size:11px; color:var(--ink-3)}
.makes{margin:0; font-size:14.5px; color:var(--ink)}
.makes b{font-weight:500}
.miss{margin:0; font-size:14px; color:var(--ink-2)}
.miss b{font-weight:500; color:var(--ink)}
.miss b.loss{color:var(--loss)}
.paying{margin:0; font-size:13px; color:var(--ink-3)}
.why h4{margin:0 0 4px; font-size:13px; font-weight:600; color:var(--ink)}
.why ul{margin:0; padding:0 0 0 16px; color:var(--ink-2); font-size:14px}
.why li{margin:0 0 3px}
.base .makes{color:var(--ink)}
.logo{width:52px; height:44px; border-radius:11px; display:grid; place-items:center; flex:none;
  font-weight:600; font-size:12px; color:#fff; letter-spacing:0.03em}
.name{font-weight:500; font-size:16px; line-height:1.2}
.tag small{display:block; font-weight:400; font-size:12px; line-height:1.3; color:var(--ink-3); margin-top:2px}

.toggles{display:flex; flex-wrap:wrap; gap:8px 24px; margin:0 0 24px; align-items:center}
.toggle{display:flex; align-items:center; gap:6px; font-size:14px}
.story{margin:0 0 8px; font-size:14px; color:var(--ink-2)}
.why h4 + .story{margin-top:0}
.toggle .tl{color:var(--ink-3); margin-right:4px}
.toggle button{font:inherit; font-size:14px; padding:6px 12px; border:1px solid var(--rule); background:var(--tile); color:var(--ink-2); border-radius:999px; cursor:pointer}
.toggle button.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.toggle button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
body.fwd .t{display:none}
body:not(.fwd) .f{display:none}
.foot{margin-top:28px; font-size:13px; color:var(--ink-3)}
</style>
</head>
<body>
<main>
<h1>Hopeboard</h1>
<p class="sub">Where people park money for a decade, and what each spot actually promises.</p>

<div class="toggle" role="group" aria-label="When"><button type="button" class="on" data-era="now">Now</button><button type="button" data-era="y1">1 year ago</button><button type="button" data-era="y5">5 years ago</button><button type="button" data-era="y10">10 years ago</button></div>
<div class="toggle basis" role="group" aria-label="Which profit to count"><button type="button" class="on" data-mode="t">last year’s profit</button><button type="button" data-mode="f">next year’s forecast</button></div>
</div>
<div id="board"></div>
<p class="foot" id="foot"></p>
</main>

  return '<div class="tile"><div class="top"><div class="head"><div class="logo" style="background:'+co.c+'">'+co.t+'</div><div class="name">'+co.n+'</div>'+
   '<div class="price"><span class="u">priced at</span><span class="n">'+d.pe+' years</span><span class="u">of that year’s profit</span></div></div>'+
   '<p class="makes">'+makes+'</p></div>'+
   '<div class="why"><h4>The story then</h4><p class="story">'+d.story+'</p><h4>What happened since</h4><p class="story">'+d.happened+'</p></div></div>';
}
function section(h,inner){ return '<h2>'+h+'</h2><div class="grid">'+inner+'</div>'; }
function render(){
  var era=document.body.dataset.era||'now', E=ERA[era], html='';
  var bond='<div class="tile base"><div class="top"><div class="head"><div class="logo" style="background:#4A5A6A">US10Y</div><div class="name">US Bond</div><div class="price"><span class="n">'+E.bond+'</span><span class="u">a year, guaranteed</span></div></div>'+
    '<p class="makes">'+(era==='now'?'Returns':'Returned')+' <b>'+E.bondReq+'/year</b> for ten years, guaranteed. '+E.bondNote+'</p></div>'+
    (era==='now'?'<div class="why"><h4>Why it matters</h4><ul><li>The floor every other return is measured against</li><li>When this goes up, every stock’s hope is worth less</li><li>Stocks have historically paid ~5 points more than this, for taking the risk</li></ul></div>':'')+'</div>';
  var g=E.gold, gold;
  if(era==='now'){
    gold='<div class="tile base"><div class="top"><div class="head"><div class="logo" style="background:#4A5A6A">GOLD</div><div class="name">Gold</div><div class="price"><span class="n">'+g.price+'</span><span class="u">an ounce, no profit</span></div></div>'+
     '<p class="makes">'+g.req+' Has returned <b>~8%/year</b> since 1971, with twenty-year stretches of nothing.</p>'+
     '<p class="miss">'+g.miss+'</p></div><div class="why"><h4>'+g.why+'</h4><ul>'+g.bullets.map(function(b){return '<li>'+b+'</li>'}).join('')+'</ul></div></div>';
  } else {
    gold='<div class="tile base"><div class="top"><div class="head"><div class="logo" style="background:#4A5A6A">GOLD</div><div class="name">Gold</div><div class="price"><span class="n">'+g.price+'</span><span class="u">an ounce then, no profit</span></div></div>'+
     '<p class="makes">No profit to price. Reasonable only if someone paid more later.</p></div>'+
     '<div class="why"><h4>The story then</h4><p class="story">'+g.story+'</p><h4>What happened since</h4><p class="story">'+g.happened+'</p></div></div>';
  }
  var s=E.spx, spx;
  if(era==='now'){
    spx='<div class="tile base"><div class="top"><div class="head"><div class="logo" style="background:#4A5A6A">SPX</div><div class="name">S&amp;P 500</div><div class="price"><span class="u">priced at</span><span class="n">'+tf(s.pe,s.pef)+' years</span><span class="u">'+tf('of last year’s profit','of next year’s forecast profit')+'</span></div></div>'+
     '<p class="makes">Has returned <b>~10%/year</b> on average since 1926, dividends included. Today’s price is reasonable assuming profit grows <b>'+tf(s.req,s.reqf)+'/year</b> — '+tf(s.cmp,s.cmpf)+' the ~'+s.last+'%/year of the last decade. People normally pay ~18 years of profit; today it’s 28.</p>'+
     '<p class="miss">'+s.miss+'</p></div><div class="why"><h4>'+s.why+'</h4><ul>'+s.bullets.map(function(b){return '<li>'+b+'</li>'}).join('')+'</ul></div></div>';
  } else {
    spx='<div class="tile base"><div class="top"><div class="head"><div class="logo" style="background:#4A5A6A">SPX</div><div class="name">S&amp;P 500</div><div class="price"><span class="u">priced at</span><span class="n">'+s.pe+' years</span><span class="u">of that year’s profit</span></div></div>'+
     '<p class="makes">This price was reasonable assuming profit grew <b>'+s.req+'/year</b> over the following decade.</p></div>'+
     '<div class="why"><h4>The story then</h4><p class="story">'+s.story+'</p><h4>What happened since</h4><p class="story">'+s.happened+'</p></div></div>';
  }
  html+=section('Baselines — '+E.label, bond+gold+spx);
  if(era==='now'){
    var ex=[],no=[],ch=[];
    CO.forEach(function(co){ var r=reqNum(co.now.req); (r>=14?ex:(r>=10?no:ch)).push(cardNow(co)); });
    html+=section('Pricey',ex.join(''))+section('Normal',no.join(''))+section('Bargain',ch.join(''));
    html+=section('History', HIST.map(function(h){
      return '<div class="tile"><div class="top"><div class="head"><div class="logo" style="background:'+h.c+'">'+h.t+'</div><div class="name">'+h.n+'</div><div class="price"><span class="u">priced at</span><span class="n">'+tf(h.pe,h.pef)+' years</span><span class="u">'+tf('of last year’s profit','of next year’s forecast profit')+'</span></div></div>'+
       '<p class="makes">This price was reasonable assuming profit grew <b>'+tf(h.req,h.reqf)+'/year</b>.</p><p class="miss">'+h.miss+'</p></div>'+
       '<div class="why"><h4>'+h.why+'</h4><ul>'+h.bullets.map(function(b){return '<li>'+b+'</li>'}).join('')+'</ul></div></div>';
    }).join(''));
  } else {
    var rows=CO.filter(function(co){return co[era]}).sort(function(a,b){return reqNum(b[era].req)-reqNum(a[era].req)});
    var ex=[],no=[],ch=[];
    rows.forEach(function(co){ var r=reqNum(co[era].req); (r>=14?ex:(r>=10?no:ch)).push(cardPast(co,era)); });
    html+=section('Pricey then',ex.join(''))+section('Normal then',no.join(''))+section('Bargain then',ch.join(''));
  }
  document.getElementById('board').innerHTML=html;
  document.querySelector('.toggle.basis').style.display = era==='now' ? '' : 'none';
  document.getElementById('foot').innerHTML = era==='now'
   ? '“Years of last year’s profit” is the P/E — the share price divided by the most recent twelve months of reported profit per share (the last four quarterly reports added up) — early-to-mid October 2026, from Yahoo, Morningstar, StockAnalysis and AP; ≈ means approximate. “Next year’s forecast” is the forward P/E: the share price divided by analysts’ average estimate of profit per share for the next twelve months. “Profit” is profit per share. “Reasonable” means the stock would match the S&amp;P 500’s long-run average of ~10%/year, assuming people are paying an ordinary 18 years of profit ten years out; dividends and buybacks count toward the return. The “if” lines use the same assumptions. Last-decade growth is 2016 to 2026, rounded. Tickers stand in for logos.'
   : 'Figures for '+E.label+' are reconstructed and approximate: years of profit to within a few, growth and returns rounded, returns are share price plus dividends where noted. “Reasonable” uses the same rule as the current board. Stories are one-line summaries of what the market was saying at the time.';
}
document.querySelectorAll('.toggle button[data-era]').forEach(function(b){ b.addEventListener('click',function(){
  document.body.dataset.era=b.dataset.era;
  document.querySelectorAll('.toggle button[data-era]').forEach(function(x){x.classList.toggle('on',x===b)});
  render();
});});
document.querySelectorAll('.toggle button[data-mode]').forEach(function(b){ b.addEventListener('click',function(){
  document.body.classList.toggle('fwd', b.dataset.mode==='f');
  document.querySelectorAll('.toggle button[data-mode]').forEach(function(x){x.classList.toggle('on',x===b)});
});});
render();
</script>
</body>
</html>
